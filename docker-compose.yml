version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: yrstream_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - yrstream-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yrstream_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/yrstream
      - STORAGE_PATH=/app/storage
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./storage:/app/storage
    depends_on:
      - mongodb
    networks:
      - yrstream-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yrstream_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - yrstream-net

volumes:
  mongodb_data:
    driver: local

networks:
  yrstream-net:
    driver: bridge
